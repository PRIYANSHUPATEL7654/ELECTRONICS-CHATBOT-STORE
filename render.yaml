services:
  - type: web
    name: electronics-store-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./electronics_store.db
  - type: web
    name: electronics-store-ui
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        sync: false

